# Hermes WebUI attached to an existing Hermes Agent stack
#
# QUICK START:
#   docker compose -f docker-compose.existing-agent.yml up -d
#   Open http://localhost:8787
#
# This starts ONLY a Hermes WebUI container. By default it uses upstream GHCR
# release tag 0.51.103; set HERMES_WEBUI_IMAGE to another upstream GHCR tag if
# you need to override that default.
# It does NOT replace an existing Hermes dashboard on 9119 or an existing
# Hermes gateway container. Instead, it reuses an existing Hermes home bind
# mount and an existing hermes-agent source checkout.
#
# Default host paths assume a sibling checkout layout:
#   ../hermes-agent       -> hermes-agent source tree
#   ../hermes-agent/data  -> existing HERMES_HOME used by the live agent stack

services:
  hermes-webui:
    image: ${HERMES_WEBUI_IMAGE:-ghcr.io/nesquena/hermes-webui:0.51.103}
    container_name: hermes-webui-existing-agent
    entrypoint:
      - /bin/bash
      - -lc
      - rm -f /tmp/hermeswebui_init.bash && cp /docker_init.override.bash /tmp/hermeswebui_init.bash && sed -i 's/\r$//' /tmp/hermeswebui_init.bash && chmod 555 /tmp/hermeswebui_init.bash && exec /tmp/hermeswebui_init.bash
    ports:
      - "${HERMES_WEBUI_BIND_HOST:-127.0.0.1}:${HERMES_WEBUI_HOST_PORT:-8787}:8787"
    volumes:
      - ./docker_init.bash:/docker_init.override.bash:ro
      # Hotfix the upstream GHCR image with this checkout's attach-flow fixes
      # until the same patches ship in an upstream release image.
      - ./api/workspace.py:/apptoo/api/workspace.py:ro
      - ./api/streaming.py:/apptoo/api/streaming.py:ro
      - ./api/terminal.py:/apptoo/api/terminal.py:ro
      # Reuse the existing Hermes home directory from the live agent stack.
      - ${HERMES_AGENT_HOST_HOME:-../hermes-agent/data}:/home/hermeswebui/.hermes
      # Persist the WebUI virtual environment across recreates so the attach
      # workflow can keep using upstream GHCR images without reinstalling the
      # WebUI's runtime deps on every container replace.
      - hermes-webui-attach-venv:/app/venv
      # Mount the existing hermes-agent checkout so docker_init.bash can install
      # the agent package and dependencies into the WebUI virtual environment.
      - ${HERMES_AGENT_REPO:-../hermes-agent}:/opt/hermes:ro
      # Keep uv's download/build cache across recreates so first-boot package
      # fetches are reusable even when the container itself is replaced.
      - hermes-webui-attach-uv-cache:/uv_cache
      # Workspace shown in the WebUI file browser.
      - ${HERMES_WORKSPACE:-..}:/workspace
      # Compatibility mount for existing Hermes configs that still use
      # terminal.cwd: /opt/data/workspace.
      - ${HERMES_WORKSPACE:-..}:/opt/data/workspace
    environment:
      - WANTED_UID=${UID:-1000}
      - WANTED_GID=${GID:-1000}
      - UV_HTTP_TIMEOUT=${UV_HTTP_TIMEOUT:-120}
      - UV_HTTP_RETRIES=${UV_HTTP_RETRIES:-5}
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8787
      - HERMES_WEBUI_STATE_DIR=/home/hermeswebui/.hermes/webui
      - HERMES_WEBUI_AGENT_DIR=/opt/hermes
      # Optional reduced-functionality attach mode: uncomment to skip
      # hermes-agent bootstrap and bring up a browsing-only UI faster.
      # - HERMES_WEBUI_SKIP_AGENT_INSTALL=1
      - HERMES_WEBUI_SKIP_AGENT_INSTALL=${HERMES_WEBUI_SKIP_AGENT_INSTALL:-}
      # Match the common terminal.cwd path from existing Hermes agent stacks.
      - HERMES_WEBUI_DEFAULT_WORKSPACE=/opt/data/workspace
      # Optional shell-visible Python packages installed into /app/venv/
      # shell-python and exposed through PYTHONPATH for command-agent shells.
      # - HERMES_WEBUI_EXTRA_SHELL_PYTHON_PACKAGES=reportlab
      - HERMES_WEBUI_EXTRA_SHELL_PYTHON_PACKAGES=${HERMES_WEBUI_EXTRA_SHELL_PYTHON_PACKAGES:-}
      # Optional attach-mode local Ollama override. docker_init.bash mirrors
      # these repo-local env values into the mounted Hermes home so the shared
      # runtime sees the same provider/base_url/default-model settings.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - HERMES_MODEL=${HERMES_MODEL:-}
      # Optional: set a password if you expose beyond localhost.
      # - HERMES_WEBUI_PASSWORD=change-me-to-something-strong
      # Optional: if the existing Hermes home intentionally keeps .env group-readable.
      # - HERMES_SKIP_CHMOD=1
      # - HERMES_HOME_MODE=0640
    restart: unless-stopped

volumes:
  hermes-webui-attach-venv:
  hermes-webui-attach-uv-cache: